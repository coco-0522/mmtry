<body>
<div class="game-container">
    <button class="music-control" id="music-toggle">🔊</button>
    <h1>学霸数学速算小游戏 <span class="emoji">✨</span></h1>
    <p class="subtitle">选择题目类型，输入答案后自动检查对错</p>
    
    <div class="player-name">
        <input type="text" id="player-name" placeholder="输入你的名字" maxlength="10">
    </div>

    <div class="operation-selector">
        <button class="operation-btn active" data-operation="add">加法➕</button>
        <button class="operation-btn" data-operation="subtract">减法➖</button>
        <button class="operation-btn" data-operation="multiply">乘法✖️</button>
        <button class="operation-btn" data-operation="divide">除法➗</button>
        <button class="operation-btn" data-operation="random">随机🎲</button>
    </div>

    <div class="timer" id="timer">用时: 0秒</div>
    <div class="level" id="level">关卡: 1/20</div>
    
    <div class="score" id="score">得分: 0</div>

    <div class="problem" id="problem">5 × 3 = ?</div>

    <input type="number" id="answer" placeholder="答案" autofocus>
    <div class="feedback" id="feedback"></div>

    <div class="summary" id="summary">
        <h3>答题总结 <span class="emoji">📊</span></h3>
        <div class="player-summary" id="player-summary">小玩家的成绩</div>
        <div class="summary-item">
            <span>总答题数:</span>
            <span id="total-answers">0</span>
        </div>
        <div class="summary-item">
            <span>正确:</span>
            <span id="correct-answers">0</span>
        </div>
        <div class="summary-item">
            <span>错误:</span>
            <span id="wrong-answers">0</span>
        </div>
        <div class="summary-item">
            <span>正确率:</span>
            <span id="accuracy">0%</span>
        </div>
        <div class="summary-item">
            <span>用时:</span>
            <span id="total-time">0秒</span>
        </div>
    </div>

    <div class="history">
        <h3>答题历史 <span class="emoji">📝</span></h3>
        <div class="history-controls">
            <button class="history-btn active" id="show-all">全部</button>
            <button class="history-btn" id="show-correct">正确</button>
            <button class="history-btn" id="show-incorrect">错误</button>
        </div>
        <div class="history-list" id="history-list">
            <p>还没有答题记录哦~</p>
        </div>
    </div>
</div>

<!-- 音频文件 -->
<audio id="correct-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3" preload="auto"></audio>
<audio id="wrong-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3" preload="auto"></audio>
<audio id="success-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" preload="auto"></audio>
<audio id="bg-music" loop src="https://assets.mixkit.co/music/preview/mixkit-happy-children-138.mp3" preload="auto"></audio>

<script>
    let score = 0;
    let num1, num2, correctAnswer;
    let history = [];
    let isChecking = false;
    let historyFilter = 'all';
    let operation = 'multiply';
    let timeElapsed = 0;
    let timer;
    let correctCount = 0;
    let wrongCount = 0;
    let gameStarted = false;
    let playerName = '小玩家';
    let musicOn = true;
    let audioContextInitialized = false;
    let currentLevel = 1;
    const maxLevel = 20;
    let usedProblems = [];
    const maxUsedProblems = 50; // 最大记录题目数

    // 音频元素
    const correctSound = document.getElementById('correct-sound');
    const wrongSound = document.getElementById('wrong-sound');
    const successSound = document.getElementById('success-sound');
    const bgMusic = document.getElementById('bg-music');
    bgMusic.volume = 0.4;

    // 初始化游戏
    function initGame() {
        score = 0;
        history = [];
        correctCount = 0;
        wrongCount = 0;
        timeElapsed = 0;
        gameStarted = false;
        currentLevel = 1;
        usedProblems = [];
        
        const nameInput = document.getElementById('player-name');
        playerName = nameInput.value.trim() || '小玩家';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        
        updateHistoryDisplay();
        updateSummary();
        document.getElementById('timer').textContent = `用时: ${timeElapsed}秒`;
        document.getElementById('level').textContent = `关卡: ${currentLevel}/${maxLevel}`;
        document.getElementById('summary').style.display = 'none';
        
        if (timer) clearInterval(timer);
        
        initAudioContext();
    }

    // 生成不重复的题目
    function generateProblem() {
        if (!gameStarted) return;
        
        isChecking = false;
        
        let problemKey;
        let attempts = 0;
        const maxAttempts = 100; // 增加最大尝试次数
        
        // 如果是随机模式，随机选择一个运算类型
        let currentOperation = operation;
        if (operation === 'random') {
            const operations = ['add', 'subtract', 'multiply', 'divide'];
            currentOperation = operations[Math.floor(Math.random() * operations.length)];
        }
        
        do {
            switch (currentOperation) {
                case 'add':
                    num1 = Math.floor(Math.random() * 50) + 1;
                    num2 = Math.floor(Math.random() * 50) + 1;
                    correctAnswer = num1 + num2;
                    problemKey = `add:${num1}+${num2}`; // 添加运算类型前缀
                    break;
                case 'subtract':
                    num1 = Math.floor(Math.random() * 50) + 1;
                    num2 = Math.floor(Math.random() * num1) + 1;
                    correctAnswer = num1 - num2;
                    problemKey = `sub:${num1}-${num2}`;
                    break;
                case 'multiply':
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    correctAnswer = num1 * num2;
                    problemKey = `mul:${num1}×${num2}`;
                    break;
                case 'divide':
                    num2 = Math.floor(Math.random() * 10) + 1;
                    correctAnswer = Math.floor(Math.random() * 10) + 1;
                    num1 = num2 * correctAnswer;
                    problemKey = `div:${num1}÷${num2}`;
                    break;
            }
            
            attempts++;
            if (attempts >= maxAttempts) {
                // 如果尝试次数过多，清空已用题目记录
                usedProblems = [];
                break;
            }
        } while (usedProblems.includes(problemKey));
        
        usedProblems.push(problemKey);
        
        // 如果已用题目过多，移除最早的记录
        if (usedProblems.length > maxUsedProblems) {
            usedProblems.shift();
        }
        
        // 根据运算类型显示题目
        switch (currentOperation) {
            case 'add':
                document.getElementById('problem').textContent = `${num1} + ${num2} = ?`;
                break;
            case 'subtract':
                document.getElementById('problem').textContent = `${num1} - ${num2} = ?`;
                break;
            case 'multiply':
                document.getElementById('problem').textContent = `${num1} × ${num2} = ?`;
                break;
            case 'divide':
                document.getElementById('problem').textContent = `${num1} ÷ ${num2} = ?`;
                break;
        }

        const answerInput = document.getElementById('answer');
        answerInput.value = '';
        answerInput.className = '';
        answerInput.focus();
        answerInput.disabled = false;

        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
    }

    // 切换音乐
    function toggleMusic() {
        musicOn = !musicOn;
        document.getElementById('music-toggle').textContent = musicOn ? '🔊' : '🔇';
        
        if (musicOn) {
            playAudio(bgMusic);
        } else {
            bgMusic.pause();
        }
    }

    // 开始游戏
    function startGame() {
        if (gameStarted) return;
        
        gameStarted = true;
        playAudio(bgMusic);
        generateProblem();
        
        timer = setInterval(() => {
            timeElapsed++;
            document.getElementById('timer').textContent = `用时: ${timeElapsed}秒`;
        }, 1000);
    }

    // 结束游戏
    function endGame(isWin) {
        clearInterval(timer);
        document.getElementById('answer').disabled = true;
        document.getElementById('summary').style.display = 'block';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        document.getElementById('total-time').textContent = `${timeElapsed}秒`;
        updateSummary();
        bgMusic.pause();
        
        if (isWin) {
            playAudio(successSound);
            createCatCelebration();
        }
    }

    // 创建猫咪庆祝效果
    function createCatCelebration() {
        const celebration = document.createElement('div');
        celebration.className = 'cat-celebration';
        document.body.appendChild(celebration);

        const cats = ['😺', '😸', '😹', '😻', '🙀', '🐱', '🐈'];
        
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const cat = document.createElement('span');
                cat.textContent = cats[Math.floor(Math.random() * cats.length)];
                cat.style.fontSize = (Math.random() * 20 + 24) + 'px';
                cat.style.left = Math.random() * 100 + '%';
                cat.style.top = '-50px';
                cat.style.animationDuration = (Math.random() * 3 + 2) + 's';
                celebration.appendChild(cat);

                setTimeout(() => cat.remove(), 3000);
            }, i * 150);
        }

        setTimeout(() => celebration.remove(), 3000);
    }

    // 检查答案
    function checkAnswer() {
        if (isChecking || !gameStarted) return;

        const userAnswer = parseInt(document.getElementById('answer').value);
        if (isNaN(userAnswer)) return;

        isChecking = true;
        const answerInput = document.getElementById('answer');
        const feedback = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            answerInput.className = 'correct';
            feedback.textContent = `正确！${num1} ${getOperationSymbol()} ${num2} = ${correctAnswer} 🎉`;
            feedback.className = 'feedback correct';
            score++;
            correctCount++;

            playAudio(correctSound);

            addHistory(true, userAnswer);

            // 检查是否通过当前关卡
            currentLevel++;
            document.getElementById('level').textContent = `关卡: ${currentLevel}/${maxLevel}`;
            
            if (currentLevel > maxLevel) {
                // 通关所有关卡
                setTimeout(() => {
                    endGame(true);
                }, 500);
                return;
            }

            setTimeout(() => {
                generateProblem();
                isChecking = false;
            }, 1000);
        } else {
            answerInput.className = 'incorrect';
            feedback.textContent = `不对哦！${num1} ${getOperationSymbol()} ${num2} 不等于 ${userAnswer}`;
            feedback.className = 'feedback incorrect';
            wrongCount++;

            playAudio(wrongSound);

            addHistory(false, userAnswer);

            isChecking = false;
        }

        updateSummary();
    }

    // 获取运算符号
    function getOperationSymbol() {
        switch (operation) {
            case 'add': return '+';
            case 'subtract': return '-';
            case 'multiply': return '×';
            case 'divide': return '÷';
            case 'random': return '?';
            default: return '×';
        }
    }

    // 初始化音频上下文
    function initAudioContext() {
        if (audioContextInitialized) return;
        
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const audioContext = new AudioContext();
                if (audioContext.state === 'suspended') {
                    document.body.addEventListener('click', () => audioContext.resume(), { once: true });
                }
            }
            
            [correctSound, wrongSound, successSound, bgMusic].forEach(audio => {
                audio.load().catch(e => console.log('音频预加载失败:', e.name));
            });
            
            audioContextInitialized = true;
        } catch (e) {
            console.log('音频上下文初始化失败:', e);
        }
    }

    // 播放音频
    function playAudio(audioElement) {
        if (!musicOn) return;
        
        try {
            audioElement.currentTime = 0;
            const playPromise = audioElement.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('自动播放被阻止，等待用户交互');
                    document.body.addEventListener('click', () => {
                        audioElement.play().catch(e => console.log('重试播放失败:', e));
                    }, { once: true });
                });
            }
        } catch (e) {
            console.log('播放失败:', e);
        }
    }

    // 更新答题历史
    function addHistory(isCorrect, userAnswer) {
        let operationSymbol;
        switch (operation) {
            case 'add': operationSymbol = '+'; break;
            case 'subtract': operationSymbol = '-'; break;
            case 'multiply': operationSymbol = '×'; break;
            case 'divide': operationSymbol = '÷'; break;
            case 'random': operationSymbol = '?'; break;
        }

        const historyItem = {
            problem: `${num1} ${operationSymbol} ${num2}`,
            answer: correctAnswer,
            userAnswer: userAnswer,
            isCorrect: isCorrect,
            time: new Date().toLocaleTimeString()
        };

        history.unshift(historyItem);
        if (history.length > 10) history.pop();
        updateHistoryDisplay();
    }

    // 更新答题历史显示
    function updateHistoryDisplay() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (history.length === 0) {
            historyList.innerHTML = '<p>还没有答题记录哦~</p>';
        } else {
            const filteredHistory = history.filter(item => {
                if (historyFilter === 'all') return true;
                if (historyFilter === 'correct') return item.isCorrect;
                if (historyFilter === 'incorrect') return !item.isCorrect;
                return true;
            });

            if (filteredHistory.length === 0) {
                historyList.innerHTML = `<p>没有${historyFilter === 'correct' ? '正确' : '错误'}的答题记录~</p>`;
            } else {
                filteredHistory.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = `history-item ${item.isCorrect ? 'history-correct' : 'history-incorrect'}`;
                    const icon = item.isCorrect ? '✅' : '❌';
                    historyItem.innerHTML = `
                        <strong>${icon} ${item.problem} = ${item.answer}</strong>
                        <br>
                        你的答案: ${item.userAnswer} (${item.time})
                    `;
                    historyList.appendChild(historyItem);
                });
            }
        }
    }

    // 设置历史筛选
    function setHistoryFilter(filter) {
        historyFilter = filter;
        updateHistoryDisplay();

        document.getElementById('show-all').classList.remove('active');
        document.getElementById('show-correct').classList.remove('active');
        document.getElementById('show-incorrect').classList.remove('active');
        document.getElementById(`show-${filter}`).classList.add('active');
    }

    // 设置运算类型
    function setOperation(op) {
        operation = op;
        initGame();
        
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.operation-btn[data-operation="${op}"]`).classList.add('active');
        
        startGame();
    }

    // 更新总结
    function updateSummary() {
        const total = correctCount + wrongCount;
        const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
        
        document.getElementById('total-answers').textContent = total;
        document.getElementById('correct-answers').textContent = correctCount;
        document.getElementById('wrong-answers').textContent = wrongCount;
        document.getElementById('accuracy').textContent = `${accuracy}%`;
        document.getElementById('score').textContent = `得分: ${score}`;
    }

    // 事件监听
    document.getElementById('answer').addEventListener('input', function() {
        if (this.value.length === String(correctAnswer).length) checkAnswer();
    });

    document.getElementById('show-all').addEventListener('click', () => setHistoryFilter('all'));
    document.getElementById('show-correct').addEventListener('click', () => setHistoryFilter('correct'));
    document.getElementById('show-incorrect').addEventListener('click', () => setHistoryFilter('incorrect'));

    document.querySelectorAll('.operation-btn').forEach(btn => {
        btn.addEventListener('click', () => setOperation(btn.dataset.operation));
    });

    document.getElementById('music-toggle').addEventListener('click', toggleMusic);

    document.getElementById('player-name').addEventListener('input', function() {
        playerName = this.value.trim() || '小玩家';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
    });

    // 初始设置
    setOperation('multiply');

    // 点击页面后初始化游戏
    document.addEventListener('click', function initGameOnFirstClick() {
        initAudioContext();
        playAudio(bgMusic);
        document.removeEventListener('click', initGameOnFirstClick);
    }, { once: true });

    // 解决iOS键盘问题
    window.addEventListener('resize', function() {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
            window.scrollTo(0, 0);
        }
    });

    // 禁用双击缩放
    document.addEventListener('dblclick', function(e) {
        e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
